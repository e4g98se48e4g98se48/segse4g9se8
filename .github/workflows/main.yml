name: 🦙 Local LLM Web Interface (Optimized)
on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║   🦙  L O C A L   L L M   W E B   U I   ( O P T I M I Z E D )     ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  💾 Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPUs:    $(nproc)"
          echo "  ⏱️ Timeout:  6 Hours (360 minutes)"
          echo "  💽 Disk before cleanup:"
          df -h / | tail -1

      - name: 🧹 Free up disk space
        run: |
          echo "──────────────────────────────────────────"
          echo " 🧹  Reclaiming disk space"
          echo "──────────────────────────────────────────"
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "  💽 Disk after cleanup:"
          df -h / | tail -1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Ollama + Python packages"
          echo "──────────────────────────────────────────"
          curl -fsSL https://ollama.com/install.sh | sh
          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic psutil
          ollama --version
          python --version

      - name: 🚀 Start Ollama server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama"
          echo "──────────────────────────────────────────"
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "⏳ Waiting for Ollama to become ready..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 📥 Download 0.5B to 7B Models
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Downloading All 0.5B to 7B Models"
          echo "──────────────────────────────────────────"
          
          MODELS=(
            # --- Qwen Family (General & Code) ---
            "qwen2.5:0.5b"
            "qwen2.5:1.5b"
            "qwen2.5:3b"
            "qwen2.5:7b"
            "qwen2.5-coder:0.5b"
            "qwen2.5-coder:1.5b"
            "qwen2.5-coder:3b"
            "qwen2.5-coder:7b"
            
            # --- DeepSeek Family ---
            "deepseek-r1:1.5b"
            "deepseek-r1:7b"
            "deepseek-coder:1.3b"
            "deepseek-coder:6.7b"
            
            # --- Llama Family ---
            "llama3.2:1b"
            "llama3.2:3b"
            "tinyllama"
            
            # --- Gemma Family ---
            "gemma2:2b"
            
            # --- Phi Family ---
            "phi3.5"
            "phi3:mini"
            
            # --- Mistral Family ---
            "mistral:7b"
            "openhermes"
            "dolphin-mistral"
            
            # --- Small & Fast Alternates ---
            "smollm:1.7b"
            "orca-mini:3b"
            "stablelm2:1.6b"
          )

          total=${#MODELS[@]}
          current=0
          for model in "${MODELS[@]}"; do
            current=$((current + 1))
            echo ""
            echo "──────────────────────────────────────────"
            echo " [$current/$total] Pulling $model"
            echo "──────────────────────────────────────────"
            if ! ollama pull "$model"; then
              echo "❌ Failed to pull $model (Maybe out of disk space) – skipping to next..."
            fi
            echo "  💽 Disk usage now:"
            df -h / | tail -1
          done
          echo ""
          echo "✅ All pulls attempted. Final model list:"
          ollama list

      - name: 🔧 Write the web server (Glassmorphism UI)
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          import json
          import os
          import logging
          import platform
          import psutil
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("llama-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))

          app = FastAPI(title="Local LLM UI (Optimized)")

          class ChatMessage(BaseModel):
              role: str
              content: str

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok"}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/sysinfo")
          def sysinfo():
              return {
                  "cpu_threads": psutil.cpu_count(logical=True),
                  "ram_total": f"{psutil.virtual_memory().total / (1024**3):.1f} GB",
                  "os": platform.system() + " " + platform.release()
              }

          @app.get("/api/stats")
          def stats():
              return {
                  "cpu_percent": psutil.cpu_percent(interval=None),
                  "ram_percent": psutil.virtual_memory().percent,
                  "ram_used": f"{psutil.virtual_memory().used / (1024**3):.1f} GB"
              }

          @app.get("/api/models")
          async def list_models():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                      data = r.json()
                      models = [m["name"] for m in data.get("models", [])]
                      return {"models": models}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  yield f"data: {json.dumps({'error': body.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  if err := obj.get("error"):
                                      yield f"data: {json.dumps({'error': err})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("chat stream failed")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"

              return StreamingResponse(generate(), media_type="text/event-stream")

          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local LLM Studio</title>
          
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
          
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
          
          <style>
            :root {
              --bg: #09090b;
              --sidebar: rgba(24, 24, 27, 0.6);
              --border: rgba(255, 255, 255, 0.08);
              --text: #f4f4f5;
              --text-secondary: #a1a1aa;
              --accent: #10b981;
              --accent-glow: rgba(16, 185, 129, 0.3);
              --cyan: #06b6d4;
              --user-bg: rgba(6, 182, 212, 0.05);
              --assistant-bg: transparent;
              --input-bg: rgba(24, 24, 27, 0.7);
              --code-bg: rgba(0, 0, 0, 0.4);
              --danger: #ef4444;
              --ok: #10b981;
              --glass: blur(16px);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: 'Inter', 'Vazirmatn', sans-serif;
              background-image: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.04), transparent 25%),
                                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.04), transparent 25%);
            }
            .sidebar {
              width: 290px; background: var(--sidebar); border-right: 1px solid var(--border);
              backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; z-index: 10;
            }
            .new-chat-btn {
              display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px;
              background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
              font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 24px;
              transition: all 0.2s ease; font-family: inherit;
            }
            .new-chat-btn:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
            
            .settings-group { display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: var(--text-secondary); }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; }
            .settings-group input[type="range"] { width: 100%; accent-color: var(--cyan); margin-top: 4px; }
            #modelSelect {
              background: rgba(0,0,0,0.2); color: var(--text); border: 1px solid var(--border);
              border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; margin-bottom: 16px;
              font-family: inherit; outline: none; transition: border-color 0.2s;
            }
            #modelSelect:focus { border-color: var(--cyan); }
            #modelSelect option { background: var(--bg); }
            
            /* System Stats UI */
            .system-stats {
              background: rgba(0,0,0,0.3); border: 1px solid var(--border);
              border-radius: 12px; padding: 14px; margin-top: 20px;
              font-size: 12px; display: flex; flex-direction: column; gap: 6px;
            }
            .stat-title { font-weight: 600; color: var(--text); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
            .stat-row { display: flex; justify-content: space-between; align-items: center; }
            .stat-value { font-family: monospace; font-size: 13px; }
            #sysSpecs { color: var(--text-secondary); margin-bottom: 8px; line-height: 1.4; }
            .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 2px; }
            .progress-fill { height: 100%; transition: width 0.3s ease; }

            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px;
              font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 10px;
            }
            .model-tag {
              background: rgba(6, 182, 212, 0.1); color: var(--cyan); padding: 6px 10px;
              border-radius: 6px; font-weight: 600; width: fit-content; border: 1px solid rgba(6, 182, 212, 0.2);
            }
            .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; }
            .status-dot.ok { background: var(--ok); color: var(--ok); }
            .status-dot.bad { background: var(--danger); color: var(--danger); }
            
            .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 0 150px 0; scroll-behavior: smooth; }
            
            .message-row {
              width: 100%; display: flex; justify-content: center; padding: 24px 20px;
              border-bottom: 1px solid rgba(255,255,255,0.02); animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .message-row.user { background: var(--user-bg); }
            .message-row.error .message-body { color: var(--danger); }
            
            .message-inner { max-width: 850px; width: 100%; display: flex; gap: 20px; line-height: 1.7; font-size: 15px; }
            .avatar {
              width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
              font-size: 18px; font-weight: 600; flex-shrink: 0; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            .avatar.user { background: linear-gradient(135deg, var(--cyan), #0284c7); }
            .avatar.assistant { background: linear-gradient(135deg, var(--accent), #059669); }
            
            .message-body { flex: 1; overflow-x: auto; min-width: 0; padding-top: 4px; }
            .message-body p { margin: 0 0 16px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body pre {
              background: var(--code-bg); color: #e2e8f0; padding: 35px 16px 16px; border-radius: 10px;
              overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); position: relative;
            }
            .message-body code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 5px; }
            .message-body pre code { background: transparent; padding: 0; }
            .code-lang { position: absolute; top: 10px; left: 16px; font-size: 12px; color: #64748b; font-weight: 500; }
            .copy-btn {
              position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); border: none;
              color: #cbd5e1; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
            }
            .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
            .message-body table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; border-radius: 8px; overflow: hidden; }
            .message-body th, .message-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
            .message-body th { background: rgba(255,255,255,0.05); font-weight: 600; }
            
            .input-area-wrapper {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--bg) 30%);
              padding: 30px 24px 30px 24px; display: flex; justify-content: center;
            }
            .input-box {
              max-width: 850px; width: 100%; background: var(--input-bg); border: 1px solid var(--border);
              border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-end;
              padding: 12px 16px; gap: 12px; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              transition: border-color 0.3s ease;
            }
            .input-box:focus-within { border-color: var(--accent); }
            .input-box textarea {
              flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit;
              font-size: 15px; resize: none; outline: none; max-height: 200px; min-height: 26px; line-height: 26px;
            }
            .input-box textarea::placeholder { color: #52525b; }
            .send-btn, .stop-btn {
              border: none; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center;
              justify-content: center; color: #fff; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-size: 18px;
            }
            .send-btn { background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
            .stop-btn { background: var(--danger); display: none; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
            .send-btn:hover { background: #059669; transform: translateY(-2px); }
            .stop-btn:hover { background: #dc2626; transform: translateY(-2px); }
            .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
            
            .loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
            @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
            
            @media (max-width: 768px) {
              .sidebar { position: fixed; height: 100vh; transform: translateX(-100%); transition: 0.3s ease; }
              .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
              .menu-btn {
                display: flex; position: absolute; top: 16px; left: 16px; z-index: 20; width: 40px; height: 40px;
                align-items: center; justify-content: center; background: var(--input-bg); border: 1px solid var(--border);
                border-radius: 10px; cursor: pointer; backdrop-filter: var(--glass); color: var(--text);
              }
              .message-inner { max-width: 100%; gap: 12px; }
              .avatar { width: 30px; height: 30px; font-size: 14px; }
            }
          </style>
          </head>
          <body>
            <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" style="display: none;">☰</button>
            
            <div class="sidebar">
              <button class="new-chat-btn" onclick="clearChat()"><span>＋</span> New Chat</button>
              
              <div class="settings-group">
                <label style="margin-bottom: 4px; color: var(--text);">Model Selection</label>
                <select id="modelSelect"></select>
                
                <div style="margin-top: 10px;">
                  <label>Temperature <span id="tempVal" style="color: var(--cyan);">0.7</span></label>
                  <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                </div>
                
                <div style="margin-top: 10px;">
                  <label>Max Tokens <span id="tokenVal" style="color: var(--cyan);">2048</span></label>
                  <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
                </div>
              </div>

              <!-- System Resource Monitor -->
              <div class="system-stats">
                <div class="stat-title">🖥️ Server Hardware</div>
                <div id="sysSpecs">Loading...</div>
                
                <div class="stat-title" style="margin-top: 6px;">📊 Live Usage</div>
                
                <div class="stat-row">
                  <span>CPU:</span>
                  <span id="cpuVal" class="stat-value" style="color: var(--cyan);">0%</span>
                </div>
                <div class="progress-bar"><div id="cpuBar" class="progress-fill" style="background: var(--cyan); width: 0%;"></div></div>
                
                <div class="stat-row" style="margin-top: 8px;">
                  <span>RAM:</span>
                  <span id="ramVal" class="stat-value" style="color: var(--accent);">0%</span>
                </div>
                <div class="progress-bar"><div id="ramBar" class="progress-fill" style="background: var(--accent); width: 0%;"></div></div>
                <div id="ramUsedText" style="text-align: right; font-size: 10px; color: var(--text-secondary); margin-top: 2px;">0 GB Used</div>
              </div>

              <div class="sidebar-footer">
                <span class="model-tag" id="currentModelTag">📦 Loading...</span>
                <span id="statusIndicator"><span class="status-dot ok"></span>Checking connection...</span>
                <span id="tokenCounter" style="color: var(--cyan);">Tokens generated: 0</span>
              </div>
            </div>

            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✦</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>

              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Message local model... (Markdown, code, math supported)" rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            if (window.innerWidth <= 768) { document.querySelector('.menu-btn').style.display = 'flex'; }
            
            marked.setOptions({
              gfm: true, breaks: true,
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              }
            });

            function decorateCodeBlocks(body) {
              body.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const codeEl = pre.querySelector('code');
                const langMatch = codeEl && codeEl.className.match(/language-(\w+)/);
                if (langMatch) {
                  const label = document.createElement('span');
                  label.className = 'code-lang';
                  label.textContent = langMatch[1];
                  pre.appendChild(label);
                }
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                  navigator.clipboard.writeText(pre.innerText.replace(/^Copy\s*/, '')).then(() => {
                    btn.textContent = 'Copied!';
                    btn.style.background = 'var(--ok)';
                    setTimeout(() => { btn.textContent = 'Copy'; btn.style.background = ''; }, 2000);
                  });
                };
                pre.appendChild(btn);
              });
            }

            function renderInto(el, text, opts = {}) {
              const rawHtml = marked.parse(text);
              el.innerHTML = DOMPurify.sanitize(rawHtml) + (opts.loading ? '<span class="loading-dots"></span>' : '');
              if (window.renderMathInElement) {
                renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true },
                    { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }
                  ],
                  throwOnError: false
                });
              }
              if (!opts.loading) decorateCodeBlocks(el);
            }

            const STORE_KEY = 'llama-ui-glass-v1';
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const tokenCounter = document.getElementById('tokenCounter');
            const statusIndicator = document.getElementById('statusIndicator');
            const temperatureEl = document.getElementById('temperature');
            const maxTokensEl = document.getElementById('maxTokens');
            const modelSelect = document.getElementById('modelSelect');
            const currentModelTag = document.getElementById('currentModelTag');
            
            let isStreaming = false, totalTokens = 0, messageHistory = [], controller = null, currentModel = null;
            let statPollInterval;

            // --- Stats & SysInfo Logic ---
            async function fetchSysInfo() {
              try {
                const r = await fetch('/api/sysinfo');
                const data = await r.json();
                document.getElementById('sysSpecs').innerHTML = `OS: ${data.os}<br>CPU: ${data.cpu_threads} Cores<br>RAM: ${data.ram_total}`;
              } catch (e) {
                document.getElementById('sysSpecs').innerText = "Unavailable";
              }
            }
            
            async function fetchStats() {
              try {
                const r = await fetch('/api/stats');
                const data = await r.json();
                
                document.getElementById('cpuVal').textContent = data.cpu_percent.toFixed(1) + '%';
                document.getElementById('cpuBar').style.width = data.cpu_percent + '%';
                
                document.getElementById('ramVal').textContent = data.ram_percent.toFixed(1) + '%';
                document.getElementById('ramBar').style.width = data.ram_percent + '%';
                document.getElementById('ramUsedText').textContent = data.ram_used + ' Used';
              } catch (e) {}
            }
            
            // Poll slowly when idle, fast when generating
            function setPolling(fast) {
              clearInterval(statPollInterval);
              fetchStats(); // call immediately
              statPollInterval = setInterval(fetchStats, fast ? 1000 : 3000);
            }
            
            fetchSysInfo();
            setPolling(false);
            // -----------------------------

            async function loadModels() {
              try {
                const resp = await fetch('/api/models');
                if (!resp.ok) throw new Error('Failed to fetch models');
                const data = await resp.json();
                const models = data.models || [];
                if (models.length === 0) {
                  modelSelect.innerHTML = '<option value="">No models found</option>'; return;
                }
                modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
                modelSelect.value = models[0];
                currentModel = models[0];
                updateModelTag();
              } catch (e) {
                modelSelect.innerHTML = '<option value="">Error loading models</option>';
              }
            }

            function updateModelTag() {
              currentModelTag.textContent = currentModel ? '📦 ' + currentModel : '📦 (no model)';
            }

            modelSelect.addEventListener('change', function() {
              currentModel = this.value; updateModelTag(); saveState();
            });

            function saveState() {
              try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                  temperature: temperatureEl.value, maxTokens: maxTokensEl.value,
                  messageHistory, totalTokens, model: currentModel
                }));
              } catch { }
            }

            function restoreState() {
              try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return;
                const s = JSON.parse(raw);
                if (s.temperature) { temperatureEl.value = s.temperature; document.getElementById('tempVal').textContent = s.temperature; }
                if (s.maxTokens) { maxTokensEl.value = s.maxTokens; document.getElementById('tokenVal').textContent = s.maxTokens; }
                if (s.model) {
                  setTimeout(() => {
                    if (modelSelect.querySelector(`option[value="${s.model}"]`)) {
                      modelSelect.value = s.model; currentModel = s.model; updateModelTag();
                    }
                  }, 100);
                }
                if (Array.isArray(s.messageHistory)) {
                  messageHistory = s.messageHistory; totalTokens = s.totalTokens || 0;
                  messageHistory.forEach(m => appendMessage(m.role, m.content));
                  tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                }
              } catch { }
            }

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                statusIndicator.innerHTML = r.ok ? '<span class="status-dot ok"></span>Connected to Ollama' : '<span class="status-dot bad"></span>Ollama unreachable';
              } catch { statusIndicator.innerHTML = '<span class="status-dot bad"></span>Ollama unreachable'; }
            }
            checkHealth(); setInterval(checkHealth, 15000);

            userInput.addEventListener('input', function () {
              this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
            userInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            temperatureEl.addEventListener('input', function () { document.getElementById('tempVal').textContent = this.value; saveState(); });
            maxTokensEl.addEventListener('input', function () { document.getElementById('tokenVal').textContent = this.value; saveState(); });

            function appendMessage(role, content, isLoading = false, isError = false) {
              const row = document.createElement('div');
              row.className = `message-row ${role}` + (isError ? ' error' : '');
              row.innerHTML = `<div class="message-inner">
                <div class="avatar ${role}">${role === 'user' ? '👤' : '✦'}</div>
                <div class="message-body"></div>
              </div>`;
              chatContainer.appendChild(row);
              const body = row.querySelector('.message-body');
              renderInto(body, content, { loading: isLoading });
              chatContainer.scrollTop = chatContainer.scrollHeight;
              return body;
            }

            function updateLastAssistantMessage(content, isComplete = false) {
              const rows = chatContainer.querySelectorAll('.message-row.assistant');
              if (!rows.length) return;
              const body = rows[rows.length - 1].querySelector('.message-body');
              renderInto(body, content, { loading: !isComplete });
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function clearChat() {
              const rows = chatContainer.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              messageHistory = []; totalTokens = 0; tokenCounter.textContent = 'Tokens generated: 0';
              saveState();
            }

            function stopGenerating() { if (controller) controller.abort(); }

            async function sendMessage() {
              if (isStreaming) return;
              const text = userInput.value.trim();
              if (!text) return;
              if (!currentModel) return alert('Please select a model first.');
              
              appendMessage('user', text);
              messageHistory.push({ role: 'user', content: text });
              userInput.value = ''; userInput.style.height = 'auto';
              sendButton.style.display = 'none'; stopButton.style.display = 'flex';
              isStreaming = true; controller = new AbortController();
              appendMessage('assistant', 'Processing', true);
              
              // Poll fast while generating
              setPolling(true);
              
              let fullContent = '';
              try {
                const response = await fetch('/api/chat', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
                  body: JSON.stringify({
                    messages: messageHistory, model: currentModel,
                    temperature: parseFloat(temperatureEl.value), max_tokens: parseInt(maxTokensEl.value)
                  })
                });
                
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '', streamError = null;
                
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.error) streamError = parsed.error;
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantMessage(fullContent, false);
                      }
                    } catch { }
                  }
                }
                
                if (streamError) throw new Error(streamError);
                updateLastAssistantMessage(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                saveState();
              } catch (error) {
                if (error.name === 'AbortError') {
                  updateLastAssistantMessage(fullContent + '\n\n*(stopped)*', true);
                  if (fullContent) { messageHistory.push({ role: 'assistant', content: fullContent }); saveState(); }
                } else {
                  updateLastAssistantMessage(`⚠️ ${error.message || 'Error generating response.'}`, true);
                }
              }
              
              sendButton.style.display = 'flex'; stopButton.style.display = 'none';
              isStreaming = false; controller = null; userInput.focus();
              
              // Revert to slow polling
              setPolling(false);
            }

            loadModels().then(() => {
              restoreState();
              if (!currentModel && modelSelect.options.length > 0) {
                currentModel = modelSelect.value; updateModelTag();
              }
              const welcome = document.getElementById('welcomeMsg');
              renderInto(welcome, `System ready. The active model is **${currentModel || 'loading'}**. Code, math, and tables are fully supported in this glassmorphic environment.`);
            });
          </script>
          </body>
          </html>
          '''
          
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written"

      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid

          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi

      - name: 📦 Install cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi

          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║              🎉  Y O U R   L L M   I S   R E A D Y  🎉            ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"

          {
            echo "## 🦙 Your LLM web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Models downloaded:** 24+ Models (0.5B to 7B)"
            echo "**Context:** ${CONTEXT_SIZE} tokens"
            echo ""
            echo "> This link stays live for as long as this job keeps running (up to the 6-hour timeout, or until you cancel the run)."
          } >> "$GITHUB_STEP_SUMMARY"

          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
